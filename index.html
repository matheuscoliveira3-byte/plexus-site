<style>
/* A página inicial provisória (14/10/2026): uma tela só, o fundo do topo da V2 em tela inteira, o título,
 * a frase dele e, embaixo, o rodapé mínimo com a privacidade, os termos e o contato.
 * O fundo: a paleta da V0 com o creme mais fechado (a decisão dele de 13/10, 10:19, «C»), o véu leve da V2
 * e o halo em volta das letras. Sem a sombra larga atrás do texto. Fica a técnica da V1: a imagem parada
 * primeiro, o pedido de menos movimento e o peso. O botão de pausar saiu (o recado dele de 13/10, 10:48). */
body { background: #24311d; }
.palco {
  position: relative; display: flex; flex-direction: column; overflow: hidden;
  min-height: max(480px, 100svh);
  background: #24311d url('/assets/img/fundo-960.webp') center / cover no-repeat;
  color: #fff;
}
.hero-media { position: absolute; inset: 0; }
.hero-media canvas { display: block; opacity: 0; transition: opacity 600ms ease; }
.hero-media.vivo canvas { opacity: 1; }
.palco::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(180deg, rgba(8, 12, 6, 0.32) 0%, rgba(8, 12, 6, 0) 26%),
    linear-gradient(180deg, rgba(0, 0, 0, 0) 45%, rgba(0, 0, 0, 0.38) 100%),
    linear-gradient(rgba(8, 12, 6, 0.14), rgba(8, 12, 6, 0.14));
}
/* a barra fica sobre o fundo, transparente, com a marca em branco */
.palco .nav { position: absolute; top: 0; left: 0; right: 0; z-index: 3; background: transparent; border-bottom-color: transparent; color: #fff; }
.hero { position: relative; z-index: 2; flex: 1; display: flex; align-items: center; padding: calc(var(--nav-h) + 32px) 0 32px; }
.hero-text { width: 100%; text-align: center; }
/* o halo escuro e macio em volta de cada letra, preso ao texto */
.palco { --halo: 0 0 1px rgba(8, 12, 6, 0.5), 0 0 6px rgba(8, 12, 6, 0.45), 0 0 18px rgba(8, 12, 6, 0.35); }
.hero h1, .hero .lead, .pe, .palco .nav .wordmark { text-shadow: var(--halo); }
.palco .nav .brand svg { filter: drop-shadow(0 0 10px rgba(10, 15, 8, 0.5)); }
/* o título no desenho da V0 cinema (a Plex 400, -0,03em, linha de 1,08) na escala da V1 (48 no computador) */
.hero h1 { color: #fff; letter-spacing: -0.03em; line-height: 1.08; max-width: none; margin: 0 auto; width: fit-content; }
.hero .lead { max-width: var(--measure-lead); margin: 20px auto 0; color: #fff; }
/* a sombra pequena, presa ao bloco do título e da frase, com 20 % de preto (a da V2 tinha 66 %): só o creme mais
 * fechado não bastava, porque o verde claro da paleta deixa o título em 3,99:1. Ela cobre o bloco e se apaga em volta. */
.bloco { position: relative; width: fit-content; margin: 0 auto; }
.bloco::before { content: ''; position: absolute; z-index: -1; inset: -8px -24px; border-radius: 48px; pointer-events: none;
  background: rgba(8, 12, 6, 0.2); box-shadow: 0 0 48px 24px rgba(8, 12, 6, 0.2); }
/* o rodapé mínimo, dentro da primeira tela */
.pe { position: relative; z-index: 2; padding: 0 0 20px; color: #fff; }
.pe .wrap { display: flex; align-items: center; justify-content: space-between; gap: 8px 32px; flex-wrap: wrap; min-height: 36px; }
.pe ul { list-style: none; display: flex; flex-wrap: wrap; gap: 4px 24px; }
.pe a { color: #fff; text-decoration: none; border-radius: 4px; }
.pe a:hover { text-decoration: underline; }

/* O celular: a mesma tela, o rodapé centrado em duas linhas */
@media (max-width: 640px) {
  .hero { padding: calc(var(--nav-h) + 24px) 0 24px; }
  .pe .wrap { flex-direction: column; justify-content: center; }
  .pe ul { justify-content: center; gap: 4px 20px; }
}
</style>
